# Playback on these pins blanks (cuases flashing) on the LG panel. The AMD
# driver sends that audio on the same DisplayPort link as the picture.
# WirePlumber skips a node when node.disabled is true.
# https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/alsa.html

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_c4_00.1.HiFi__HDMI1__sink"
      }
      {
        node.name = "alsa_output.pci-0000_c4_00.1.HiFi__HDMI2__sink"
      }
      {
        node.name = "alsa_output.pci-0000_c4_00.1.HiFi__HDMI3__sink"
      }
      {
        node.name = "alsa_output.pci-0000_c4_00.1.HiFi__HDMI4__sink"
      }
      {
        node.nick = "LG HDR 4K"
      }
    ]
    actions = {
      update-props = {
        node.disabled = "true"
      }
    }
  }
]
